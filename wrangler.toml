name = "testcenter"
main = "src/index.js"
compatibility_date = "2025-10-01"
# Keep variables added in the Cloudflare dashboard when deploying from GitHub.
keep_vars = true

routes = [
  { pattern = "tc.ictroo.com", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "testcenter-db"
database_id = "1f1b7f8c-2a44-4f92-bd33-2ee3513ea727"

[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# Requests to the old workers.dev address are redirected here (preview URLs are not affected).
CANONICAL_HOST = "tc.ictroo.com"
LEGACY_HOST = "testcenter.ictroo.workers.dev"

[observability]
enabled = true
